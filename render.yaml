services:
  - type: background_worker
    name: caresetu-gait-screening
    runtime: python
    runtimeVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_DEFAULT_TIMEOUT
        value: "600"
      - key: PYTHONUNBUFFERED
        value: "1"
    preDeployCommand: python -m py_compile core/*.py ui/*.py main.py app.py

databases:
  - name: gait-records
    dbName: gait_records
    region: oregon
