services:
  - type: web
    name: caresetu-gait-screening
    runtime: python
    runtimeVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --worker-class gthread --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PIP_DEFAULT_TIMEOUT
        value: "600"
      - key: PYTHONUNBUFFERED
        value: "1"
    preDeployCommand: python -m py_compile core/*.py ui/*.py main.py app.py

databases:
  - name: gait-records
    dbName: gait_records
    region: oregon
